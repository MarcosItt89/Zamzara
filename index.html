<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/zamzara.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zamzara — Creando tu momento</title>
    <script>
      /* Aplica fondo oscuro antes de que React cargue para evitar flash blanco */
      (function () {
        var t = localStorage.getItem("zamzara-theme");
        if (t !== "light") {
          document.documentElement.style.background = "#0e0a1a";
          document.body && (document.body.style.background = "#0e0a1a");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
